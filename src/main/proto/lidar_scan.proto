syntax = "proto3";

package com.noahjutz.proto;
option java_multiple_files = true;

message PointCloud {
  repeated Point points = 1;
}

message Point {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
}

message Warning {
  uint32 distance = 1;
}

service MeasureDistanceService {
  rpc measureDistance(stream PointCloud) returns (stream Warning);
}