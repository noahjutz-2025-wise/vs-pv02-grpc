syntax = "proto3";

package com.noahjutz.proto;
option java_multiple_files = true;

message PointCloud {
  repeated Point points = 1;
}

message Point {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Warning {
  double distance = 1;
}

service LidarWarningService {
  rpc measureDistance(stream PointCloud) returns (stream Warning);
}